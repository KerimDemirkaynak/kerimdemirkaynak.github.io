    <style>
        :root {
            --bg-color: #000000; /* OLED Gerçek Siyah */
            --card-bg: #121212;
            --border-color: #2a2a2a;
            --hover-border: #666666;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        /* 
         * Tam Kare Grid Yapısı 
         * Masaüstünde 4 sütun, aralarda 16px boşluk.
         */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            max-width: 800px;
            width: 100%;
        }

        /* Profil Kartı (Sadece Bu Kart Geniş Kalmalı) */
        .profile-card {
            grid-column: span 4;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 0.5rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            flex-shrink: 0;
        }

        .profile-info h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .profile-info p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1rem;
        }

        /* Kare Kutu Tasarımı */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            aspect-ratio: 1 / 1; /* Kusursuz kare olmasını sağlar */
        }

        .card:hover {
            border-color: var(--hover-border);
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }

        /* İkon ve Metin Stilleri */
        .card i {
            font-size: 2.5rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .card span {
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.2;
        }

        /* Üzerine Gelince Çıkan Marka Renkleri */
        .github:hover i { color: #ffffff; }
        .youtube:hover i { color: #ff0000; }
        .twitter:hover i { color: #ffffff; }
        .spotify:hover i { color: #1db954; }
        .mal:hover i { color: #2e51a2; }
        .steam:hover i { color: #66c0f4; }
        .linkedin:hover i { color: #0a66c2; }
        .twitch:hover i { color: #9146ff; }
        .instagram:hover i { color: #e1306c; }
        .crunchyroll:hover i { color: #f47521; }
        .bluesky:hover i { color: #0085ff; }
        .threads:hover i { color: #ffffff; }
        .facebook:hover i { color: #1877f2; }
        .pinterest:hover i { color: #e60023; }
        .tumblr:hover i { color: #36465d; }
        .mastodon:hover i { color: #5c4bdf; }
        .wattpad:hover i { color: #ff500a; }
        .globe:hover i { color: #3b82f6; }
        .blog:hover i { color: #f59e0b; }

        /* MOBİL ÖLÇEKLENDİRME */
        @media (max-width: 768px) {
            .bento-grid {
                /* Mobilde tam "ikişerli" kareler */
                grid-template-columns: repeat(2, 1fr); 
                gap: 12px;
            }
            
            .profile-card {
                grid-column: span 2; /* Mobilde profil satırı tam kaplar */
                flex-direction: column;
                text-align: center;
                gap: 1rem;
                padding: 1.5rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .profile-info h1 {
                font-size: 1.5rem;
            }

            .card i {
                font-size: 2rem;
            }
        }
    </style>
</head>
