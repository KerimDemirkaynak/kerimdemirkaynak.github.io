<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f5;
  --text: #15171c;
  --muted: #6b7280;
  --border: #e2e5ec;
  --accent: #6d5efc;
  --accent-soft: rgba(109, 94, 252, .12);
  --danger: #e5484d;
  --ok: #18a058;
  --shadow: 0 8px 30px rgba(20, 24, 40, .08);
  --radius: 14px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1f232c;
  --text: #eceef3;
  --muted: #8b93a3;
  --border: #272c37;
  --accent: #8b7dff;
  --accent-soft: rgba(139, 125, 255, .16);
  --danger: #ff6369;
  --ok: #3ccf8e;
  --shadow: 0 8px 30px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  transition: background .2s, color .2s;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Giriş ekranı */
#login {
  height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-card {
  width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 36px 28px; text-align: center; box-shadow: var(--shadow);
}
.logo {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--accent), #c06cff); display: grid; place-items: center; color: #fff;
}
.logo svg { width: 28px; height: 28px; }
.login-card h1 { margin: 0 0 6px; font-size: 1.5rem; }
.login-card p { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
.login-err { color: var(--danger); font-size: .88rem; margin-top: 14px; min-height: 1.2em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 9px 14px; font-weight: 600; font-size: .9rem; transition: background .15s, transform .1s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger:hover { color: var(--danger); border-color: var(--danger); }
.btn.big { width: 100%; padding: 13px; font-size: 1rem; border-radius: 12px; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid transparent; background: transparent; color: var(--muted); transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { color: var(--danger); }

/* Uygulama */
#app { height: 100%; display: none; grid-template-columns: 320px 1fr; }
aside {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.side-head { padding: 16px 16px 10px; display: flex; align-items: center; gap: 8px; }
.side-head h2 { margin: 0; font-size: 1.15rem; flex: 1; }
.search { padding: 0 16px 12px; position: relative; }
.search svg { position: absolute; left: 28px; top: 11px; color: var(--muted); width: 16px; height: 16px; }
.search input {
  width: 100%; padding: 10px 12px 10px 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); outline: none;
}
.search input:focus { border-color: var(--accent); }
.new-wrap { padding: 0 16px 12px; }
#list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.item {
  display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
  padding: 11px 12px; border-radius: 10px; margin-bottom: 2px;
}
.item:hover { background: var(--surface-2); }
.item.active { background: var(--accent-soft); border-color: var(--accent-soft); }
.item .t { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .p { color: var(--muted); font-size: .82rem; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .d { color: var(--muted); font-size: .74rem; margin-top: 4px; opacity: .8; }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: .92rem; }
.user-bar {
  border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 8px;
  font-size: .8rem; color: var(--muted);
}
.user-bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.editor-head {
  display: flex; align-items: center; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.back { display: none; }
#title {
  flex: 1; min-width: 0; border: none; background: transparent; outline: none;
  font-size: 1.25rem; font-weight: 700; padding: 6px 8px; border-radius: 8px;
}
#title:focus { background: var(--surface-2); }
.editor-wrap { flex: 1; min-height: 0; display: flex; padding: 16px; }
#note {
  flex: 1; width: 100%; resize: none; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius); padding: 20px; font-size: 1rem; line-height: 1.7; outline: none;
  box-shadow: var(--shadow);
}
#note:focus { border-color: var(--accent); }
.editor-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 0 20px 14px; font-size: .8rem; color: var(--muted);
}
#status.ok { color: var(--ok); }
#status.err { color: var(--danger); }
.no-note { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; }
.no-note .logo { opacity: .85; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; display: flex; align-items: center; gap: 14px;
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; font-size: .9rem; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: none; color: var(--accent); font-weight: 700; padding: 0; }
:root[data-theme="light"] .toast button { color: #8b7dff; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #app aside { display: flex; }
  #app main { display: none; }
  #app.show-editor aside { display: none; }
  #app.show-editor main { display: flex; }
  .back { display: grid; }
  .editor-wrap { padding: 12px; }
  #note { padding: 16px; }
  /* iOS zoom önleme */
  #note, #title, .search input { font-size: 16px; }
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
    </div>
    <h1>Notlarım</h1>
    <p>Notlarına erişmek için giriş yap.</p>
    <button id="loginBtn" class="btn primary big">Google ile giriş yap</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="side-head">
      <h2>Notlarım</h2>
      <button id="themeBtn" class="icon-btn" title="Tema" aria-label="Tema değiştir">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="new-wrap">
      <button id="newBtn" class="btn primary big">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Yeni not
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Notlarda ara…" autocomplete="off">
    </div>
    <div id="list"></div>
    <div class="user-bar">
      <span id="userEmail"></span>
      <button id="logoutBtn" class="btn" style="padding:6px 10px;font-size:.78rem">Çıkış</button>
    </div>
  </aside>

  <main>
    <div id="editor" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="editor-head">
        <button id="backBtn" class="icon-btn back" aria-label="Geri">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <input id="title" placeholder="Başlık" maxlength="120" autocomplete="off">
        <button id="copyBtn" class="icon-btn" title="Kopyala" aria-label="Kopyala">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <button id="shareBtn" class="icon-btn" title="Paylaş" aria-label="Paylaş">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
        <button id="downloadBtn" class="icon-btn" title="İndir (.txt)" aria-label="İndir">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
        <button id="deleteBtn" class="icon-btn danger" title="Sil" aria-label="Sil">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
      <div class="editor-wrap">
        <textarea id="note" placeholder="Notunu buraya yaz…" spellcheck="true"></textarea>
      </div>
      <div class="editor-foot">
        <span id="status">Hazır</span>
        <span id="counts"></span>
      </div>
    </div>
    <div id="noNote" class="no-note">
      <div>
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg></div>
        <div>Bir not seç ya da yeni bir not oluştur.</div>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="toast"><span id="toastMsg"></span><button id="toastAction" style="display:none"></button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGapO0lBmLlJeiSPNXwj5gvE_fIXx2HwY",
  authDomain: "notlarim-ee58d.firebaseapp.com",
  databaseURL: "https://notlarim-ee58d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "notlarim-ee58d",
  storageBucket: "notlarim-ee58d.firebasestorage.app",
  messagingSenderId: "104701316276",
  appId: "1:104701316276:web:6c40345fdd3eea9059dbe1",
  measurementId: "G-L5R3W846YL"
};

const ALLOWED = ['aschannel111@gmail.com', 'kerimdemirkaynak@yaani.com', 'cnbmgtr@gmail.com'];

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const $ = id => document.getElementById(id);
const el = {
  login: $('login'), loginBtn: $('loginBtn'), loginErr: $('loginErr'),
  app: $('app'), list: $('list'), search: $('search'), newBtn: $('newBtn'),
  userEmail: $('userEmail'), logoutBtn: $('logoutBtn'), themeBtn: $('themeBtn'),
  editor: $('editor'), noNote: $('noNote'), title: $('title'), note: $('note'),
  status: $('status'), counts: $('counts'), backBtn: $('backBtn'),
  copyBtn: $('copyBtn'), shareBtn: $('shareBtn'), downloadBtn: $('downloadBtn'), deleteBtn: $('deleteBtn'),
  toast: $('toast'), toastMsg: $('toastMsg'), toastAction: $('toastAction')
};

// ---------- Tema ----------
const savedTheme = (() => { try { return localStorage.getItem('theme'); } catch { return null; } })();
const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
const syncThemeColor = () => document.querySelector('meta[name="theme-color"]').content =
  document.documentElement.dataset.theme === 'dark' ? '#0f1115' : '#f4f5f8';
syncThemeColor();
el.themeBtn.onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch {}
  syncThemeColor();
};

// ---------- Durum ----------
const ROOT = 'kerimNotData';
let notes = {};            // id -> {title, content, updatedAt}
let currentId = null;
let dirty = false;
let saveTimer = null;
let unsub = null;
let migrated = false;
let toastTimer = null;

const noteRef = id => ref(db, `${ROOT}/notes/${id}`);

function toast(msg, actionLabel, action) {
  clearTimeout(toastTimer);
  el.toastMsg.textContent = msg;
  if (actionLabel) {
    el.toastAction.style.display = '';
    el.toastAction.textContent = actionLabel;
    el.toastAction.onclick = () => { action(); el.toast.classList.remove('show'); };
  } else {
    el.toastAction.style.display = 'none';
  }
  el.toast.classList.add('show');
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), actionLabel ? 6000 : 2200);
}

function setStatus(text, kind = '') {
  el.status.textContent = text;
  el.status.className = kind;
}

const fmtDate = ts => {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay
    ? d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
};

function updateCounts() {
  const text = el.note.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  el.counts.textContent = `${words} kelime · ${text.length} karakter`;
}

// ---------- Liste ----------
function renderList() {
  const q = el.search.value.trim().toLocaleLowerCase('tr-TR');
  const items = Object.entries(notes)
    .map(([id, n]) => ({ id, ...n }))
    .filter(n => !q || (n.title || '').toLocaleLowerCase('tr-TR').includes(q) || (n.content || '').toLocaleLowerCase('tr-TR').includes(q))
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  el.list.textContent = '';
  if (!items.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = q ? 'Sonuç bulunamadı.' : 'Henüz not yok.';
    el.list.appendChild(d);
    return;
  }
  for (const n of items) {
    const b = document.createElement('button');
    b.className = 'item' + (n.id === currentId ? ' active' : '');
    const t = document.createElement('div'); t.className = 't'; t.textContent = n.title || 'Başlıksız not';
    const p = document.createElement('div'); p.className = 'p';
    p.textContent = (n.content || '').replace(/\s+/g, ' ').slice(0, 90) || 'Boş not';
    const d = document.createElement('div'); d.className = 'd'; d.textContent = fmtDate(n.updatedAt);
    b.append(t, p, d);
    b.onclick = () => openNote(n.id);
    el.list.appendChild(b);
  }
}

// ---------- Editör ----------
async function flush() {
  clearTimeout(saveTimer);
  if (!dirty || !currentId) return;
  await saveNow();
}

function openNote(id) {
  flush();
  currentId = id;
  const n = notes[id];
  if (!n) return showEmpty();
  el.title.value = n.title || '';
  el.note.value = n.content || '';
  el.editor.style.display = 'flex';
  el.noNote.style.display = 'none';
  el.app.classList.add('show-editor');
  setStatus(n.updatedAt ? `Son kayıt: ${fmtDate(n.updatedAt)}` : 'Hazır');
  updateCounts();
  renderList();
}

function showEmpty() {
  currentId = null;
  el.editor.style.display = 'none';
  el.noNote.style.display = 'grid';
  el.app.classList.remove('show-editor');
  renderList();
}

function scheduleSave() {
  dirty = true;
  setStatus('Yazılıyor…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}

async function saveNow() {
  clearTimeout(saveTimer);
  if (!currentId || !dirty) return;
  const user = auth.currentUser;
  if (!user || !ALLOWED.includes(user.email)) return setStatus('Kaydetme yetkin yok', 'err');
  const id = currentId;
  const data = { title: el.title.value.trim(), content: el.note.value, updatedAt: Date.now() };
  dirty = false;
  setStatus('Kaydediliyor…');
  try {
    await set(noteRef(id), data);
    if (currentId === id && !dirty) setStatus('Kaydedildi ✓', 'ok');
  } catch (e) {
    console.error(e);
    dirty = true;
    setStatus('Kaydedilemedi — bağlantıyı veya yetkiyi kontrol et', 'err');
  }
}

async function createNote() {
  await flush();
  const r = push(ref(db, `${ROOT}/notes`));
  const data = { title: '', content: '', updatedAt: Date.now() };
  notes[r.key] = data;
  try { await set(r, data); } catch (e) { console.error(e); toast('Not oluşturulamadı'); delete notes[r.key]; return; }
  openNote(r.key);
  el.title.focus();
}

async function deleteCurrent() {
  if (!currentId) return;
  const id = currentId;
  const backup = notes[id] && { ...notes[id] };
  clearTimeout(saveTimer); dirty = false;
  try { await remove(noteRef(id)); } catch (e) { console.error(e); return toast('Silinemedi'); }
  delete notes[id];
  showEmpty();
  toast('Not silindi', 'Geri al', async () => {
    if (!backup) return;
    await set(noteRef(id), { ...backup, updatedAt: Date.now() });
  });
}

// ---------- Eylemler ----------
const noteAsText = () => (el.title.value ? el.title.value + '\n\n' : '') + el.note.value;

el.copyBtn.onclick = async () => {
  try { await navigator.clipboard.writeText(el.note.value); toast('Kopyalandı'); }
  catch {
    el.note.select();
    try { document.execCommand('copy'); toast('Kopyalandı'); } catch { toast('Kopyalanamadı'); }
  }
};

el.shareBtn.onclick = async () => {
  const text = noteAsText();
  if (navigator.share) {
    try { await navigator.share({ title: el.title.value || 'Not', text }); } catch (e) { if (e.name !== 'AbortError') console.error(e); }
  } else {
    try { await navigator.clipboard.writeText(text); toast('Not metni panoya kopyalandı'); } catch { toast('Paylaşım desteklenmiyor'); }
  }
};

el.downloadBtn.onclick = () => {
  const blob = new Blob([noteAsText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  const name = (el.title.value || 'not').replace(/[\\/:*?"<>|]+/g, '').trim() || 'not';
  a.href = URL.createObjectURL(blob);
  a.download = name + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

el.deleteBtn.onclick = deleteCurrent;
el.newBtn.onclick = createNote;
el.backBtn.onclick = async () => { await flush(); el.app.classList.remove('show-editor'); };
el.search.oninput = renderList;
el.title.oninput = scheduleSave;
el.note.oninput = () => { updateCounts(); scheduleSave(); };

addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); }
});
addEventListener('beforeunload', e => { if (dirty) { saveNow(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

// ---------- Veri dinleme ----------
function startListening() {
  stopListening();
  unsub = onValue(ref(db, ROOT), snap => {
    const root = snap.val() || {};
    const incoming = root.notes || {};

    // Eski tek-notluk veriyi bir kez yeni yapıya taşı
    if (!migrated && !root.migrated && !Object.keys(incoming).length && root.content && root.content.trim()) {
      migrated = true;
      update(ref(db, ROOT), {
        'notes/eski-not': { title: 'Eski not', content: root.content, updatedAt: root.timestamp || Date.now() },
        migrated: true
      }).catch(console.error);
      return;
    }

    notes = incoming;
    if (currentId && !notes[currentId]) {
      if (!dirty) showEmpty();
    } else if (currentId && !dirty) {
      // Başka cihazdan gelen değişiklik: yazmıyorsan editörü güncelle
      const n = notes[currentId];
      const typing = document.activeElement === el.note || document.activeElement === el.title;
      if (!typing) {
        el.title.value = n.title || '';
        el.note.value = n.content || '';
        updateCounts();
      }
      setStatus(`Son kayıt: ${fmtDate(n.updatedAt)}`);
    }
    renderList();
  }, err => {
    console.error(err);
    el.list.textContent = '';
    const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Notları yükleme yetkin yok.';
    el.list.appendChild(d);
  });
}
function stopListening() { if (unsub) { unsub(); unsub = null; } }

// ---------- Kimlik doğrulama ----------
onAuthStateChanged(auth, user => {
  if (user && ALLOWED.includes(user.email)) {
    el.login.style.display = 'none';
    el.app.style.display = 'grid';
    el.userEmail.textContent = user.email;
    el.loginErr.textContent = '';
    startListening();
  } else {
    stopListening();
    notes = {}; currentId = null; dirty = false; migrated = false;
    el.app.style.display = 'none';
    el.login.style.display = 'flex';
    el.app.classList.remove('show-editor');
    if (user) {
      el.loginErr.textContent = 'Bu hesaba erişim izni verilmemiş.';
      signOut(auth);
    }
  }
});

el.loginBtn.onclick = async () => {
  el.loginErr.textContent = '';
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      return signInWithRedirect(auth, provider);
    }
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
      console.error(e);
      el.loginErr.textContent = 'Giriş yapılamadı, tekrar dene.';
    }
  }
};
el.logoutBtn.onclick = async () => { await flush(); signOut(auth); };
</script>
</body>
</html>
