<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Notlarım</title>
<meta name="theme-color" content="#0f1115">
<meta property="og:title" content="Notlarım">
<meta property="og:image" content="https://kerimdemirkaynak.github.io/resimler/20241121_055155.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kerim Not">
<meta name="twitter:description" content="Notlarım">
<meta name="twitter:image" content="https://kerimdemirkaynak.github.io/resimler/20241121_055155.jpg">
<meta name="twitter:url" content="https://kerimdemirkaynak.github.io/">
<meta name="google-site-verification" content="0TjmUuV639weMDTURj4svFO7cFKj9T2fQ7NoBvc6QPo">
<link rel="icon" type="image/png" href="https://kerimdemirkaynak.github.io/resimler/favicon.png">

<style>
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eceef4;
  --text: #15171c;
  --muted: #6b7280;
  --border: #e1e4ec;
  --accent: #6d5efc;
  --accent-soft: rgba(109, 94, 252, .13);
  --danger: #e5484d;
  --ok: #18a058;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1f232c;
  --text: #eceef3;
  --muted: #8b93a3;
  --border: #272c37;
  --accent: #8b7dff;
  --accent-soft: rgba(139, 125, 255, .18);
  --danger: #ff6369;
  --ok: #3ccf8e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* ---- Giriş ---- */
#login { height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; text-align: center; }
.logo { width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 16px; color: #fff; background: linear-gradient(135deg, var(--accent), #c06cff); display: grid; place-items: center; }
.card h1 { margin: 0 0 6px; font-size: 1.4rem; }
.card p { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
.err { color: var(--danger); font-size: .88rem; margin-top: 14px; min-height: 1.2em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px;
  padding: 12px 14px; font-weight: 600; font-size: .92rem; transition: filter .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.block { width: 100%; padding: 14px; font-size: 1rem; }

/* ---- Uygulama ---- */
#app {
  height: 100dvh; display: flex; flex-direction: column;
  max-width: 820px; margin: 0 auto; padding: 12px 12px 0;
  padding-top: max(12px, env(safe-area-inset-top));
}
.top { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
.top h1 { margin: 0; font-size: 1.25rem; flex: 1; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
.icon-btn:active { transform: scale(.94); }

/* Not sekmeleri */
.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; max-width: 150px; height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  font-size: .86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .15s, color .15s, border-color .15s;
}
.tab.active { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tab.add { width: 36px; padding: 0; display: grid; place-items: center; }
.tab.add svg { width: 18px; height: 18px; }

.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
#note { flex: 1; min-height: 0; width: 100%; resize: none; border: none; outline: none; background: transparent; padding: 18px; font-size: 16px; line-height: 1.65; }
.meta { display: flex; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--border); font-size: .78rem; color: var(--muted); }
#status.ok { color: var(--ok); }
#status.err { color: var(--danger); }

.actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 12px 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.actions .btn { flex-direction: column; gap: 4px; padding: 10px 2px; font-size: .72rem; }
.actions .btn.danger { color: var(--danger); }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px);
  background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px;
  display: flex; align-items: center; gap: 14px; font-size: .9rem; max-width: calc(100% - 32px);
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 20;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: none; font-weight: 700; padding: 0; color: #8b7dff; }

@media (min-width: 700px) {
  #app { padding: 28px 20px 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions .btn { flex-direction: row; font-size: .9rem; padding: 11px 16px; }
  .toast { bottom: 90px; }
}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
    </div>
    <h1>Notlarım</h1>
    <p>Devam etmek için giriş yap.</p>
    <button id="loginBtn" class="btn primary block">Google ile giriş yap</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <h1>Notlarım</h1>
    <button id="themeBtn" class="icon-btn" aria-label="Tema">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="logoutBtn" class="icon-btn" aria-label="Çıkış yap" title="Çıkış yap">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <textarea id="note" placeholder="Notunu buraya yaz…" spellcheck="false" disabled></textarea>
    <div class="meta"><span id="status">Yükleniyor…</span><span id="counts"></span></div>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn primary">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      <span>Kaydet</span>
    </button>
    <button id="copyBtn" class="btn">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span>Kopyala</span>
    </button>
    <button id="shareBtn" class="btn">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span>Paylaş</span>
    </button>
    <button id="downloadBtn" class="btn">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span>İndir</span>
    </button>
    <button id="deleteBtn" class="btn danger">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      <span id="deleteLabel">Temizle</span>
    </button>
  </div>
</div>

<div id="toast" class="toast"><span id="toastMsg"></span><button id="toastAction" hidden></button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGapO0lBmLlJeiSPNXwj5gvE_fIXx2HwY",
  authDomain: "notlarim-ee58d.firebaseapp.com",
  databaseURL: "https://notlarim-ee58d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "notlarim-ee58d",
  storageBucket: "notlarim-ee58d.firebasestorage.app",
  messagingSenderId: "104701316276",
  appId: "1:104701316276:web:6c40345fdd3eea9059dbe1",
  measurementId: "G-L5R3W846YL"
};
const ALLOWED = ['aschannel111@gmail.com', 'kerimdemirkaynak@yaani.com', 'cnbmgtr@gmail.com'];

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

// Ana not eski yapıyla aynı yerde: kerimNotData/{content,timestamp}
// Ek notlar: kerimNotData/notes/{id}/{content,timestamp,createdAt}
const ROOT = 'kerimNotData';
const rootRef = ref(db, ROOT);
const MAIN = 'main';
const refFor = id => id === MAIN ? rootRef : ref(db, `${ROOT}/notes/${id}`);

const $ = id => document.getElementById(id);
const note = $('note'), statusEl = $('status'), counts = $('counts'), tabsEl = $('tabs');
const toastEl = $('toast'), toastMsg = $('toastMsg'), toastAction = $('toastAction');

// ---------- Tema ----------
const root = document.documentElement;
let savedTheme = null; try { savedTheme = localStorage.getItem('theme'); } catch {}
root.dataset.theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const metaTheme = document.querySelector('meta[name="theme-color"]');
const syncMeta = () => metaTheme.content = root.dataset.theme === 'dark' ? '#0f1115' : '#f3f4f8';
syncMeta();
$('themeBtn').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
  syncMeta();
};

// ---------- Yardımcılar ----------
let toastTimer;
function toast(msg, label, fn) {
  clearTimeout(toastTimer);
  toastMsg.textContent = msg;
  toastAction.hidden = !label;
  if (label) { toastAction.textContent = label; toastAction.onclick = () => { fn(); toastEl.classList.remove('show'); }; }
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), label ? 6000 : 2000);
}
function setStatus(t, k = '') { statusEl.textContent = t; statusEl.className = k; }
const fmt = ts => {
  const d = new Date(ts);
  return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
};
function updateCounts() {
  const t = note.value.trim();
  counts.textContent = `${t ? t.split(/\s+/).length : 0} kelime · ${note.value.length} karakter`;
}
const firstLine = txt => (txt || '').split('\n').map(s => s.trim()).find(Boolean) || '';

// ---------- Durum ----------
let notes = {};        // id -> { content, timestamp, createdAt }
let currentId = MAIN;
let dirty = false, timer = null, unsub = null, loaded = false;

// Notlara içerikten bağımsız, rastgele "kimlik" adları verilir (ana not her zaman Alfa)
const NAME_POOL = ['Beta', 'Gama', 'Delta', 'Epsilon', 'Zeta', 'Eta', 'Teta', 'Iota', 'Kappa', 'Lambda', 'Mu', 'Nu', 'Ksi', 'Omikron', 'Pi', 'Ro', 'Sigma', 'Tau', 'Upsilon', 'Fi', 'Ki', 'Psi', 'Omega'];
function pickName() {
  const used = new Set(Object.values(notes).map(n => n?.name));
  const free = NAME_POOL.filter(n => !used.has(n));
  if (free.length) return free[Math.floor(Math.random() * free.length)];
  let k = 2;
  while (used.has(`Alfa ${k}`)) k++;
  return `Alfa ${k}`;
}
const nameOf = (id, i = 0) => id === MAIN ? 'Alfa' : (notes[id]?.name || String(i + 1));
const labelOf = id => 'Not ' + nameOf(id, orderedIds().indexOf(id));

function orderedIds() {
  const rest = Object.keys(notes).filter(id => id !== MAIN).sort((a, b) => (notes[a].createdAt || 0) - (notes[b].createdAt || 0));
  return [MAIN, ...rest];
}

function renderTabs() {
  tabsEl.textContent = '';
  const ids = orderedIds();
  ids.forEach((id, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (id === currentId ? ' active' : '');
    b.textContent = 'Not ' + nameOf(id, i);
    b.onclick = () => switchTo(id);
    tabsEl.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'tab add';
  add.setAttribute('aria-label', 'Yeni not');
  add.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  add.onclick = createNote;
  tabsEl.appendChild(add);
  tabsEl.querySelector('.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  $('deleteLabel').textContent = currentId === MAIN ? 'Temizle' : 'Sil';
}

function showCurrent() {
  const n = notes[currentId] || { content: '' };
  note.value = n.content || '';
  setStatus(n.timestamp ? 'Son kayıt: ' + fmt(n.timestamp) : 'Henüz kayıt yok');
  updateCounts();
  renderTabs();
}

async function switchTo(id) {
  if (id === currentId) return;
  if (!confirmDiscard()) return;
  dirty = false;
  currentId = id;
  try { localStorage.setItem('lastNote', id); } catch {}
  showCurrent();
  if (!matchMedia('(max-width: 699px)').matches) note.focus();
}

// ---------- Kaydetme ----------
async function save() {
  clearTimeout(timer);
  const u = auth.currentUser;
  if (!u || !ALLOWED.includes(u.email)) return setStatus('Kaydetme yetkin yok', 'err');
  const id = currentId;
  const ts = Date.now();
  const content = note.value;
  dirty = false;
  setStatus('Kaydediliyor…');
  try {
    if (id === MAIN) await update(rootRef, { content, timestamp: ts });
    else await set(refFor(id), { content, timestamp: ts, createdAt: notes[id]?.createdAt || ts, name: notes[id]?.name || pickName() });
    notes[id] = { ...(notes[id] || {}), content, timestamp: ts };
    if (id === currentId && !dirty) {
      setStatus('Kaydedildi ✓', 'ok');
      setTimeout(() => { if (!dirty && id === currentId && notes[id]?.timestamp === ts) setStatus('Son kayıt: ' + fmt(ts)); }, 2000);
    }
  } catch (e) {
    console.error(e);
    if (id === currentId) { dirty = true; setStatus('Kaydedilemedi — bağlantıyı kontrol et', 'err'); }
  }
}

note.addEventListener('input', () => {
  updateCounts();
  dirty = true;
  setStatus('Kaydedilmemiş değişiklik var');
});
$('saveBtn').onclick = () => save();
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
const confirmDiscard = () => !dirty || confirm('Kaydedilmemiş değişiklikler var. Kaydetmeden devam edilsin mi?');

// ---------- Not ekle / sil ----------
async function createNote() {
  if (!confirmDiscard()) return;
  dirty = false;
  const r = push(ref(db, `${ROOT}/notes`));
  const ts = Date.now();
  const name = pickName();
  notes[r.key] = { content: '', timestamp: 0, createdAt: ts, name };
  currentId = r.key;
  showCurrent();
  note.focus();
  try { await set(r, { content: '', timestamp: ts, createdAt: ts, name }); }
  catch (e) { console.error(e); toast('Not oluşturulamadı'); delete notes[r.key]; currentId = MAIN; showCurrent(); }
}

$('deleteBtn').onclick = async () => {
  const id = currentId;
  const backup = note.value;
  if (id === MAIN) {
    if (!note.value) return;
    note.value = ''; updateCounts();
    await save();
    toast('Not temizlendi', 'Geri al', () => { note.value = backup; updateCounts(); dirty = true; save(); });
    return;
  }
  const createdAt = notes[id]?.createdAt || Date.now();
  const savedName = notes[id]?.name;
  clearTimeout(timer); dirty = false;
  try { await remove(refFor(id)); } catch (e) { console.error(e); return toast('Silinemedi'); }
  delete notes[id];
  currentId = MAIN;
  showCurrent();
  toast('Not silindi', 'Geri al', async () => {
    await set(refFor(id), { content: backup, timestamp: Date.now(), createdAt, name: savedName || 'Beta' });
    currentId = id;
  });
};

// ---------- Diğer butonlar ----------
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(note.value); toast('Kopyalandı'); }
  catch { note.select(); try { document.execCommand('copy'); toast('Kopyalandı'); } catch { toast('Kopyalanamadı'); } }
};
$('shareBtn').onclick = async () => {
  if (navigator.share) {
    try { await navigator.share({ title: labelOf(currentId), text: note.value }); }
    catch (e) { if (e.name !== 'AbortError') console.error(e); }
  } else {
    try { await navigator.clipboard.writeText(note.value); toast('Not metni kopyalandı'); } catch { toast('Paylaşım desteklenmiyor'); }
  }
};
$('downloadBtn').onclick = () => {
  if (!note.value) return toast('İndirilecek bir şey yok');
  const name = labelOf(currentId);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([note.value], { type: 'text/plain;charset=utf-8' }));
  a.download = name + '.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- Veri dinleme ----------
function listen() {
  stop();
  loaded = false;
  unsub = onValue(rootRef, snap => {
    const d = snap.val() || {};
    const incoming = { [MAIN]: { content: d.content || '', timestamp: d.timestamp || 0, createdAt: 0 } };
    for (const [id, n] of Object.entries(d.notes || {})) incoming[id] = n;

    if (!loaded) {
      loaded = true;
      let last = null; try { last = localStorage.getItem('lastNote'); } catch {}
      currentId = last && incoming[last] ? last : MAIN;
      notes = incoming;
      note.disabled = false;
      showCurrent();
      return;
    }

    // Yazmakta olduğun notu ezme; diğerlerini güncelle
    notes = incoming;

    if (!notes[currentId]) { currentId = MAIN; dirty = false; showCurrent(); return; }
    if (!dirty && notes[currentId].content !== note.value) {
      note.value = notes[currentId].content || '';
      updateCounts();
    }
    if (!dirty && notes[currentId].timestamp) setStatus('Son kayıt: ' + fmt(notes[currentId].timestamp));
    renderTabs();
  }, err => {
    console.error(err);
    setStatus('Notları yükleme yetkin yok', 'err');
  });
}
function stop() { if (unsub) { unsub(); unsub = null; } }

// ---------- Kimlik doğrulama ----------
onAuthStateChanged(auth, user => {
  if (user && ALLOWED.includes(user.email)) {
    $('login').hidden = true;
    $('app').hidden = false;
    listen();
  } else {
    stop();
    dirty = false; notes = {}; currentId = MAIN; note.value = ''; note.disabled = true;
    $('app').hidden = true;
    $('login').hidden = false;
    if (user) { $('loginErr').textContent = 'Bu hesaba erişim izni verilmemiş.'; signOut(auth); }
  }
});
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, provider);
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
      console.error(e); $('loginErr').textContent = 'Giriş yapılamadı, tekrar dene.';
    }
  }
};
$('logoutBtn').onclick = () => { if (confirmDiscard()) signOut(auth); };
</script>
</body>
</html>
